name: API CI
run-name: API CI

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

concurrency:
  group: api-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Consumes elemental-monster-duel-dto / -entity / -mapper from GitHub Packages.
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: maven
          server-id: github
          server-username: MAVEN_USERNAME
          server-password: MAVEN_TOKEN

      - name: Build
        run: mvn -B -ntp clean verify
        env:
          MAVEN_USERNAME: ${{ github.actor }}
          MAVEN_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN || secrets.GITHUB_TOKEN }}

# Deploy (CD): Render's native GitHub integration builds the Dockerfile and
# deploys on every push to `main` (render.yaml: autoDeploy: true, branch: main).
# No mvn deploy here — this repo produces a runnable app, not a published library.
