spring.application.name=elemental-monster-duel-api
server.port=${PORT:8080}
server.servlet.context-path=/elemental-monster-duel

spring.data.web.pageable.page-parameter=page
spring.data.web.pageable.size-parameter=size
spring.data.web.sort.sort-parameter=sort

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-docs.html
springdoc.swagger-ui.operationsSorter=method
springdoc.cache.disabled=true

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

api.url=${API_URL:http://localhost:8080/elemental-monster-duel}
app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5173}
