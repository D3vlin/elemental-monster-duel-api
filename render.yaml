# Render Blueprint for the Elemental Monster Duel API.
# Docs: https://render.com/docs/blueprint-spec
#
# All real secrets/values are injected by the Infisical -> Render native
# integration, so every sensitive var below is declared with `sync: false`
# (Render keeps whatever Infisical sets and never overwrites it from this file).
#
# Source of truth: Infisical project 6a30a206-7125-4bfe-b68b-d71b1b852ef9, env `prod`.
# Values currently set there:
#   MAVEN_USERNAME             D3vlin
#   MAVEN_TOKEN                GitHub classic PAT, scope read:packages
#   SPRING_DATASOURCE_URL      jdbc:postgresql://aws-0-us-east-2.pooler.supabase.com:6543/postgres?prepareThreshold=0
#   SPRING_DATASOURCE_USERNAME postgres.kjbfrarpdraxskfrqpyg
#   SPRING_DATASOURCE_PASSWORD <supabase db password>
#   APP_CORS_ALLOWED_ORIGINS   https://d3vlin.github.io
# Port 6543 = Supabase transaction pooler; prepareThreshold=0 is required for it.

services:
  - type: web
    name: elemental-monster-duel-api
    runtime: docker
    plan: free
    region: ohio
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    autoDeploy: true
    healthCheckPath: /actuator/health

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JAVA_OPTS
        value: -XX:MaxRAMPercentage=75 -XX:+UseSerialGC -Xss512k

      # ---- injected by Infisical -> Render (set sync:false, do NOT hardcode) ----

      - key: MAVEN_USERNAME
        sync: false
      - key: MAVEN_TOKEN
        sync: false

      # Supabase Postgres
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Frontend origin allowed by CORS
      - key: APP_CORS_ALLOWED_ORIGINS
        sync: false
